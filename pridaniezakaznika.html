  <h1>Servisný protokol</h1>
  <h2>Pridať zákazníka</h2>
<form id="zakaznikForm" onsubmit="event.preventDefault(); pridatZakaznika();">
  <input id="nz_nazov" name="nazov" placeholder="Názov firmy" required />
  <input id="nz_ico" name="ico" placeholder="IČO" required />
  <input id="nz_dic" name="dic" placeholder="DIČ" />
  <input id="nz_icdph" name="icdph" placeholder="IČ DPH" />
  <input id="nz_sidlo" name="sidlo" placeholder="Sídlo" />
  <input id="nz_osoba" name="osoba" placeholder="Kontaktná osoba" />
  <input id="nz_tel" name="telefon" placeholder="Telefón" />
  <input id="nz_email" name="email" placeholder="Email" type="email" />
  <button type="submit">Pridať zákazníka</button>



</form>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script>
  function pridatZakaznika() {
  const data = {
    nazov: document.getElementById('nz_nazov').value,
    ico: document.getElementById('nz_ico').value,
    dic: document.getElementById('nz_dic').value,
    icdph: document.getElementById('nz_icdph').value,
    sidlo: document.getElementById('nz_sidlo').value,
    osoba: document.getElementById('nz_osoba').value,
    telefon: document.getElementById('nz_tel').value,
    email: document.getElementById('nz_email').value,
  };

  fetch('pridat-zakaznika.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams(data)
  })
  .then(response => response.text())
  .then(text => {
    if (text.trim() === "OK") {
      alert("Zákazník bol úspešne pridaný.");
      document.getElementById('zakaznikForm').reset(); // vyčisti formulár
    } else {
      alert("Chyba pri ukladaní: " + text);
    }
  })
  .catch(error => {
    alert("Nastala chyba spojenia: " + error);
  });
}
</script>
</body>
